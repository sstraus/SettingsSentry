name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run tests
        run: go test -p 1 -v ./...

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.19.0
          install-only: true

      - name: Build release archives
        run: make release GORELEASER_ARGS="release --clean --skip=publish"

      - name: Check release archives
        run: python3 scripts/check-release.py

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/SettingsSentry_*.zip
            dist/checksums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
