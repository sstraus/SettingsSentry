name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Run golangci-lint
        run: golangci-lint run ./...

  test:
    name: Test
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install cron (for local act simulation)
        if: runner.os == 'Linux'
        # This is needed because the Ubuntu container used for simulation doesn't have cron/crontab by default.
        # The actual macos-latest runner on GitHub has it.
        run: |
          apt-get update && apt-get install -y --no-install-recommends cron || echo "apt-get failed but continuing..."
          # Verify installation and force success if command exists
          which crontab || (echo "crontab command not found after install!" && exit 1)
          crontab -l || echo "crontab -l failed but continuing..."
          exit 0

      - name: Run unit tests
        run: go test -p 1 -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.txt # Changed 'file' to 'files'
          fail_ci_if_error: false

  integration-test:
    name: Integration Tests
    runs-on: macos-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run integration tests
        run: go test -p 1 -v -tags=integration ./... # Removed incorrect -args flag

  build:
    name: Build
    runs-on: macos-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        run: make build

      - name: Create ZIP package
        run: make zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: settingssentry
          if-no-files-found: error
          path: |
            settingssentry
            settingssentry.zip
